    /**
     * Formatteert een jaargetal voor de tooltip.
     */
    function formatYear(val) {
      if (val === null || val === undefined || Number.isNaN(Number(val))) {
        return 'Doorlopend (open einde)';
      }
      const num = Number(val);
      return Number.isInteger(num) ? String(num) : num.toFixed(1).replace('.', ',');
    }

    /**
     * Groepeert items op spoor zodat activiteiten op hetzelfde spoor in het verlengde staan.
     */
    function buildRowsAndBars(sourceItems) {
      const rowMap = new Map();
      const bars = [];

      sourceItems.forEach((item, index) => {
        const groupName = (item.groep || 'Overig').trim();
        const trackName = (item.spoor || '').trim() || `Regel-${index + 1}`;
        const rowKey = `${groupName}__${trackName}`;

        if (!rowMap.has(rowKey)) {
          rowMap.set(rowKey, {
            rowKey,
            group: groupName,
            track: trackName,
            label: trackName,
            rowIndex: rowMap.size,
          });
        }

        const rowInfo = rowMap.get(rowKey);
        const startYear = Number.isFinite(Number(item.start)) ? Number(item.start) : TIJDLAS_START_JAAR;
        const isOpenEnded = item.eind === null || item.eind === undefined || Number.isNaN(Number(item.eind));
        const rawEndYear = isOpenEnded ? TIJDLAS_EINDE_JAAR : Number(item.eind);
        const endYear = Math.min(rawEndYear, TIJDLAS_EINDE_JAAR);
        const hasExplicitEndBefore2030 = !isOpenEnded && Number(item.eind) < TIJDLAS_EINDE_JAAR;
        const palette = THEME_COLORS[item.thema] || THEME_COLORS['Natuur'];

        bars.push({
          ...item,
          groep: groupName,
          spoor: trackName,
          rowIndex: rowInfo.rowIndex,
          startYear,
          endYear,
          isOpenEnded,
          hasExplicitEndBefore2030,
          palette,
          x: [startYear, Math.max(startYear + 0.15, endYear)],
          y: rowInfo.rowIndex,
        });
      });

      return {
        rows: Array.from(rowMap.values()),
        bars,
      };
    }

    /**
     * Custom Chart.js plugin voor groepskaders, traject vanaf "Nu", open einden en labels in balken.
     */
    const customTimelinePlugin = {
      id: 'customTimelinePlugin',
      beforeDatasetsDraw(chart, args, options) {
        const { ctx, chartArea, scales } = chart;
        if (!chartArea || !scales.y || !scales.x) return;

        const rows = options.rows || [];
        if (rows.length === 0) return;

        const groupBlocks = [];
        let current = null;

        rows.forEach((r, idx) => {
          if (!current || current.group !== r.group) {
            if (current) groupBlocks.push(current);
            current = { group: r.group, startIdx: idx, endIdx: idx };
          } else {
            current.endIdx = idx;
          }
        });
        if (current) groupBlocks.push(current);

        const stepHeight =
          rows.length > 1
            ? Math.abs(scales.y.getPixelForValue(1) - scales.y.getPixelForValue(0))
            : 46;
        const padY = Math.min(18, stepHeight * 0.36);

        ctx.save();
        groupBlocks.forEach((block, bIdx) => {
          const topY = scales.y.getPixelForValue(block.startIdx) - padY;
          const bottomY = scales.y.getPixelForValue(block.endIdx) + padY;
          const leftX = chartArea.left + 4;
          const rightX = chartArea.right - 4;
          const boxHeight = Math.max(24, bottomY - topY);

          ctx.fillStyle = bIdx % 2 === 0 ? 'rgba(15, 23, 42, 0.022)' : 'rgba(16, 185, 129, 0.025)';
          ctx.fillRect(leftX, topY, rightX - leftX, boxHeight);

          ctx.setLineDash([5, 4]);
          ctx.lineWidth = 1.25;
          ctx.strokeStyle = 'rgba(71, 85, 105, 0.55)';
          ctx.strokeRect(leftX, topY, rightX - leftX, boxHeight);

          ctx.setLineDash([]);
          ctx.font = '600 11px Inter, sans-serif';
          const labelText = block.group;
          const textWidth = ctx.measureText(labelText).width;
          const pillW = textWidth + 14;
          const pillH = 18;
          const pillX = rightX - pillW - 6;
          const pillY = topY + 4;

          ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
          ctx.fillRect(pillX, pillY, pillW, pillH);
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.6)';
          ctx.lineWidth = 1;
          ctx.strokeRect(pillX, pillY, pillW, pillH);

          ctx.fillStyle = '#334155';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(labelText, pillX + 7, pillY + pillH / 2 + 0.5);
        });
        ctx.restore();
      },

      afterDatasetsDraw(chart, args, options) {
        const { ctx, chartArea, scales } = chart;
        if (!chartArea || !scales.x || !scales.y) return;

        const bars = options.bars || [];
        const datasetMeta = chart.getDatasetMeta(0);
        if (!datasetMeta || !datasetMeta.data) return;

        const nuX = scales.x.getPixelForValue(NU_JAAR);

        ctx.save();
        datasetMeta.data.forEach((barEl, idx) => {
          const item = bars[idx];
          if (!item || !barEl) return;

          const left = Math.min(barEl.base, barEl.x);
          const right = Math.max(barEl.base, barEl.x);
          const width = right - left;
          const height = barEl.height || 24;
          const top = barEl.y - height / 2;
          const bottom = top + height;
          const centerY = barEl.y;

          if (!item.hasExplicitEndBefore2030) {
            ctx.save();
            ctx.fillStyle = item.palette.fill;
            ctx.fillRect(right - 4, top, 8, height);
            ctx.restore();
          }

          if (right > nuX && nuX < chartArea.right) {
            const dashStartX = Math.max(left, nuX);
            const dashEndX = right;
            if (dashEndX > dashStartX) {
              const segW = dashEndX - dashStartX;
              const radius = item.hasExplicitEndBefore2030 ? Math.min(6, height / 2, segW / 2) : 0;

              ctx.save();
              ctx.fillStyle = '#f8fafc';
              ctx.fillRect(dashStartX, top - 2, segW + 4, height + 4);

              ctx.beginPath();
              if (radius > 0) {
                ctx.moveTo(dashStartX, top);
                ctx.lineTo(dashEndX - radius, top);
                ctx.quadraticCurveTo(dashEndX, top, dashEndX, top + radius);
                ctx.lineTo(dashEndX, bottom - radius);
                ctx.quadraticCurveTo(dashEndX, bottom, dashEndX - radius, bottom);
                ctx.lineTo(dashStartX, bottom);
                ctx.closePath();
                ctx.fillStyle = item.palette.fill50;
                ctx.fill();
              } else {
                ctx.fillStyle = item.palette.fill50;
                ctx.fillRect(dashStartX, top, segW, height);
              }

              ctx.setLineDash([4, 3]);
              ctx.lineWidth = 1.75;
              ctx.strokeStyle = item.palette.fill;
              ctx.beginPath();
              if (radius > 0) {
                ctx.moveTo(dashStartX, top);
                ctx.lineTo(dashEndX - radius, top);
                ctx.quadraticCurveTo(dashEndX, top, dashEndX, top + radius);
                ctx.lineTo(dashEndX, bottom - radius);
                ctx.quadraticCurveTo(dashEndX, bottom, dashEndX - radius, bottom);
                ctx.lineTo(dashStartX, bottom);
                ctx.moveTo(dashEndX, top + radius);
                ctx.lineTo(dashEndX, bottom - radius);
              } else {
                ctx.moveTo(dashStartX, top);
                ctx.lineTo(dashEndX, top);
                ctx.moveTo(dashStartX, bottom);
                ctx.lineTo(dashEndX, bottom);
              }
              ctx.stroke();
              ctx.restore();
            }
          }

          const label = (item.naam || '').trim();
          if (label && width >= 22) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(left + 4, top, Math.max(0, width - 8), height);
            ctx.clip();

            const startsAfterNu = left >= nuX;
            ctx.fillStyle = startsAfterNu ? item.palette.border : item.palette.text;
            ctx.font = width < 68 ? '600 10.5px Inter, sans-serif' : '600 11.5px Inter, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, left + 8, centerY + 0.5);
            ctx.restore();
          }
        });

        if (nuX >= chartArea.left && nuX <= chartArea.right) {
          ctx.save();
          ctx.setLineDash([6, 4]);
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#e11d48';
          ctx.beginPath();
          ctx.moveTo(nuX, chartArea.top - 6);
          ctx.lineTo(nuX, chartArea.bottom);
          ctx.stroke();

          ctx.setLineDash([]);
          ctx.fillStyle = '#e11d48';
          ctx.font = '700 11px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText('Nu', nuX, chartArea.top - 8);
          ctx.restore();
        }

        ctx.restore();
      },
    };

    /**
     * Tekent de tijdlijn in het canvas.
     */
    function renderChart() {
      const { rows, bars } = buildRowsAndBars(ITEMS);
      const rowHeight = 42;
      const desiredHeight = Math.max(240, rows.length * rowHeight + 90);

      const wrapper = document.getElementById('chartWrapper');
      const canvas = document.getElementById('timelineCanvas');
      if (!wrapper || !canvas) return;

      wrapper.style.height = `${desiredHeight}px`;

      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: rows.map((r) => r.label),
          datasets: [
            {
              label: 'Periode',
              data: bars.map((b) => ({
                x: b.x,
                y: b.y,
                itemRef: b,
              })),
              backgroundColor: bars.map((b) => b.palette.fill),
              borderColor: bars.map((b) => b.palette.border),
              borderWidth: 1.5,
              borderSkipped: bars.map((b) => (b.hasExplicitEndBefore2030 ? false : 'right')),
              borderRadius: bars.map((b) => ({
                topLeft: 6,
                bottomLeft: 6,
                topRight: b.hasExplicitEndBefore2030 ? 6 : 0,
                bottomRight: b.hasExplicitEndBefore2030 ? 6 : 0,
              })),
              barPercentage: 0.72,
              categoryPercentage: 0.88,
            },
          ],
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          layout: {
            padding: {
              top: 18,
              right: 16,
              bottom: 6,
              left: 10,
            },
          },
          scales: {
            x: {
              type: 'linear',
              position: 'top',
              min: TIJDLAS_START_JAAR,
              max: TIJDLAS_EINDE_JAAR,
              ticks: {
                stepSize: 1,
                color: '#334155',
                font: {
                  family: 'Inter, sans-serif',
                  size: 11,
                  weight: '600',
                },
                callback: (val) => (Number.isInteger(Number(val)) ? String(val) : ''),
              },
              grid: {
                color: 'rgba(148, 163, 184, 0.25)',
              },
            },
            y: {
              type: 'linear',
              reverse: true,
              min: -0.5,
              max: Math.max(0.5, rows.length - 0.5),
              ticks: {
                display: false,
                stepSize: 1,
                autoSkip: false,
              },
              grid: {
                display: false,
              },
            },
          },
          plugins: {
            legend: {
              display: false,
            },
            tooltip: {
              backgroundColor: '#0f172a',
              titleColor: '#f8fafc',
              bodyColor: '#e2e8f0',
              borderColor: '#334155',
              borderWidth: 1,
              padding: 10,
              displayColors: true,
              callbacks: {
                title: (tooltipItems) => {
                  const raw = tooltipItems[0]?.raw?.itemRef;
                  return raw ? raw.naam : '';
                },
                label: (ctxItem) => {
                  const raw = ctxItem.raw?.itemRef;
                  if (!raw) return '';
                  const periode = `${formatYear(raw.start)} – ${raw.isOpenEnded ? 'Open / Doorlopend' : formatYear(raw.eind)}`;
                  return `Periode: ${periode} | Thema: ${raw.thema} | Groep: ${raw.groep}`;
                },
                afterLabel: (ctxItem) => {
                  const raw = ctxItem.raw?.itemRef;
                  return raw?.toelichting ? `Toelichting: ${raw.toelichting}` : '';
                },
              },
            },
            customTimelinePlugin: {
              rows,
              bars,
            },
          },
        },
        plugins: [customTimelinePlugin],
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        renderChart();
      } catch (err) {
        console.error('Fout bij het tekenen van de tijdlijn:', err);
      }
    });
  </script>
</body>
</html>
